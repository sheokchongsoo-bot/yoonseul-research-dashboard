<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 뷰포트 검수용 미리보기</title>
<style>
  body { margin: 0; background: #cfd5de; font-family: sans-serif; }
  .cols { display: flex; gap: 16px; justify-content: center; align-items: flex-start; padding: 12px; }
  .col { background: #fff; box-shadow: 0 0 0 1px #aab3c0; }
  .cap { font-size: 12px; color: #333; padding: 6px 8px; background: #e8ecf2; }
  iframe { display: block; border: 0; width: 412px; height: 1200px; }
  .col--360 iframe { width: 360px; }
</style>
</head>
<body>
<div class="cols">
  <div class="col"><div class="cap">412px (Galaxy S25 Ultra)</div><iframe data-src="./index.html" title="412px 미리보기"></iframe></div>
  <div class="col col--360"><div class="cap">360px</div><iframe data-src="./index.html" title="360px 미리보기"></iframe></div>
</div>
<script>
  document.querySelectorAll('iframe').forEach(function (f) {
    f.src = f.dataset.src + (location.hash || '');
  });
</script>
</body>
</html>
