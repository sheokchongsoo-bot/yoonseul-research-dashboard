<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 (임시)</title>
<style>
  html, body { margin: 0; background: #8a8a8a; }
  iframe { display: block; width: 412px; border: 0; background: #fff; }
</style>
</head>
<body>
<iframe id="f" src="./index.html?preview=1"></iframe>
<script>
  var f = document.getElementById('f');
  function fit() {
    try {
      var d = f.contentDocument;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      f.style.height = (h + 20) + 'px';
    } catch (e) {}
  }
  f.addEventListener('load', function () { fit(); setTimeout(fit, 600); setTimeout(fit, 1800); });
</script>
</body>
</html>
