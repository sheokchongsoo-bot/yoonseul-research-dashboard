<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임시 검수 · 글자 크기 두 체급 확대</title>
<style>
  body { margin: 0; background: #dde3ec; font-family: -apple-system, system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 9; background: #14213d; color: #fff; padding: 10px 16px; font-size: 15px; }
  .bar a { color: #cfe0ff; margin-right: 12px; }
  .slot { padding: 10px 0 22px 12px; }
  .slot h2 { font-size: 16px; margin: 0 0 6px; color: #14213d; font-weight: 700; }
  iframe { display: block; background: #fff; border: 1px solid #94a3b8; }
</style>
</head>
<body>
<div class="bar" id="bar">임시 검수 페이지 — 삭제 예정</div>
<div id="host"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const w = q.get('w') || 'all';
  const h = parseInt(q.get('h') || '1200', 10);
  const host = document.getElementById('host');
  const list = w === 'all'
    ? [360, 412, 480, 600, 768, 820, 900, 1024, 1100, 1200, 1280, 1366, 1400, 1600, 1920]
    : [parseInt(w, 10)];
  document.getElementById('bar').insertAdjacentHTML('beforeend',
    ' <a href="?w=all&h=1200">전체 계측</a>' +
    [360, 412, 768, 1400, 1920].map(function (x) { return '<a href="?w=' + x + '&h=' + h + '">' + x + '</a>'; }).join(''));
  list.forEach(function (px) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = '<h2>' + px + 'px <span data-gap></span></h2>';
    const f = document.createElement('iframe');
    f.src = 'index.html?c=' + Date.now();
    f.width = px;
    f.height = h;
    f.dataset.w = px;
    f.setAttribute('scrolling', 'yes');
    slot.appendChild(f);
    host.appendChild(slot);
  });
})();

/* 계측: 문서 가로 넘침과 잘린 텍스트를 폭별로 수집 */
window.__measure = async function () {
  const frames = Array.from(document.querySelectorAll('iframe'));
  const wait = function (f) {
    return new Promise(function (res) {
      if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.querySelector('#aiList .card')) return res();
      f.addEventListener('load', function () { setTimeout(res, 600); }, { once: true });
      setTimeout(res, 3500);
    });
  };
  await Promise.all(frames.map(wait));
  const out = [];
  for (const f of frames) {
    const d = f.contentDocument;
    const de = d.documentElement;
    const cw = de.clientWidth;
    const bad = [];
    const clipped = [];
    d.querySelectorAll('body *').forEach(function (el) {
      const r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) return;
      const cs = d.defaultView.getComputedStyle(el);
      if (r.right > cw + 1.5) {
        bad.push((el.tagName.toLowerCase()) + '.' + (String(el.className || '').split(' ')[0] || '-') +
                 ' right=' + Math.round(r.right) + ' «' + (el.textContent || '').trim().slice(0, 20) + '»');
      }
      const se = el.scrollWidth, ce = el.clientWidth;
      if (se > ce + 1 && /^(hidden|clip)$/.test(cs.overflowX) && ce > 0) {
        clipped.push((el.tagName.toLowerCase()) + '.' + (String(el.className || '').split(' ')[0] || '-') + ' ' + se + '>' + ce);
      }
    });
    const uniq = Array.from(new Set(bad));
    out.push({
      w: f.dataset.w,
      clientWidth: cw,
      scrollWidth: de.scrollWidth,
      pageOverflow: de.scrollWidth - cw,
      overflowing: uniq.length,
      worst: uniq.slice(0, 8),
      clipped: Array.from(new Set(clipped)).slice(0, 6),
      bodyFont: d.defaultView.getComputedStyle(d.body).fontSize,
      h1: (function () { const e = d.querySelector('.hero h1'); return e ? Math.round(parseFloat(d.defaultView.getComputedStyle(e).fontSize)) : null; })(),
      cardH3: (function () { const e = d.querySelector('.card h3'); return e ? Math.round(parseFloat(d.defaultView.getComputedStyle(e).fontSize)) : null; })(),
      body2: (function () { const e = d.querySelector('.card__summary'); return e ? Math.round(parseFloat(d.defaultView.getComputedStyle(e).fontSize)) : null; })(),
      tableCell: (function () { const e = d.querySelector('.fields td'); return e ? Math.round(parseFloat(d.defaultView.getComputedStyle(e).fontSize)) : null; })(),
      badge: (function () { const e = d.querySelector('.card__ep'); return e ? Math.round(parseFloat(d.defaultView.getComputedStyle(e).fontSize)) : null; })()
    });
  }
  return out;
};
</script>
</body>
</html>
